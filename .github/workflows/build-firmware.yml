name: Build firmware

on:
  workflow_dispatch:
    inputs:
      board:
        description: Target board
        type: choice
        required: true
        default: generic
        options:
          - generic
          - board-devkitc-1
          - board-devkitc-1-v1-1
          - board-s3-zero
      profile:
        description: Firmware profile
        type: choice
        required: true
        default: release
        options:
          - release
          - usb-debug
          - qual

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Rust for Xtensa
        uses: esp-rs/xtensa-toolchain@v1.7.0
        with:
          buildtargets: esp32s3
          version: "1.98.1.0"
          default: false
          override: false
          github-token: ${{ github.token }}
      - uses: taiki-e/install-action@v2
        with:
          tool: espflash@4.6.0
      - name: Install image merge tool
        run: python3 -m pip install esptool==5.5.0
      - name: Build selected firmware
        shell: bash
        env:
          BOARD: ${{ inputs.board }}
          PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          case "$BOARD" in
            generic) FEATURES="" ;;
            board-devkitc-1|board-devkitc-1-v1-1|board-s3-zero) FEATURES="$BOARD" ;;
            *) echo "Unsupported board" >&2; exit 1 ;;
          esac
          case "$PROFILE" in
            release) ;;
            usb-debug|qual) FEATURES="${FEATURES:+$FEATURES,}$PROFILE" ;;
            *) echo "Unsupported profile" >&2; exit 1 ;;
          esac
          export FEATURES
          scripts/build-image.sh firmware-out
      - uses: actions/upload-artifact@v4
        with:
          name: streambewi-esp32s3-${{ inputs.board }}-${{ inputs.profile }}
          path: firmware-out/
          if-no-files-found: error
