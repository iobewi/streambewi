name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo +stable clippy -p streambewi-core -p streambewi --locked --target x86_64-unknown-linux-gnu --all-targets -- -D warnings
      - run: cargo +stable test -p streambewi-core -p streambewi --locked --target x86_64-unknown-linux-gnu

  esp32s3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust for Xtensa
        uses: esp-rs/xtensa-toolchain@v1.7.0
        with:
          buildtargets: esp32s3
          version: "1.98.1.0"
          default: false
          override: false
          github-token: ${{ github.token }}
      - uses: taiki-e/install-action@v2
        with:
          tool: espflash@4.6.0
      - name: Release build (real link)
        run: cargo +esp build -p streambewi-esp32 --release --locked -Z build-std=core,alloc --target xtensa-esp32s3-none-elf
      - name: Product descriptor and native task storage
        run: |
          mkdir -p ci-out
          python3 tools/inspect_firmware_elf.py target/xtensa-esp32s3-none-elf/release/streambewi-esp32 > ci-out/firmware-layout.json
      - name: Install image merge tool
        run: python3 -m pip install esptool==5.5.0
      - name: Flashable image
        run: |
          mkdir -p ci-out
          python3 tools/package_image.py target/xtensa-esp32s3-none-elf/release/streambewi-esp32 ci-out/streambewi-esp32s3.bin
          sha256sum ci-out/*
      - name: USB debug build and layout
        run: |
          cargo +esp build -p streambewi-esp32 --release --locked --features usb-debug -Z build-std=core,alloc --target xtensa-esp32s3-none-elf
          python3 tools/inspect_firmware_elf.py target/xtensa-esp32s3-none-elf/release/streambewi-esp32 > ci-out/debug-layout.json
      - uses: actions/upload-artifact@v4
        with:
          name: streambewi-esp32s3-ci
          path: ci-out/
