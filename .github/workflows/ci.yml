name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - name: Radio Browser result filter (JS, no dependencies)
        run: node tools/qual/check-catalog.cjs && node --check app/src/ui.js
      - run: cargo +stable clippy -p streambewi-core -p streambewi --locked --target x86_64-unknown-linux-gnu --all-targets -- -D warnings
      - run: cargo +stable test -p streambewi-core -p streambewi --locked --target x86_64-unknown-linux-gnu

  esp32s3:
    runs-on: ubuntu-latest
    steps:
      # The head commit itself (not the synthetic merge commit) with its full history: the image's
      # build date comes from the last commit touching the sources, so the image is the one anyone
      # rebuilds from that commit with scripts/build-image.sh.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Install Rust for Xtensa
        uses: esp-rs/xtensa-toolchain@v1.7.0
        with:
          buildtargets: esp32s3
          version: "1.98.1.0"
          default: false
          override: false
          github-token: ${{ github.token }}
      - uses: taiki-e/install-action@v2
        with:
          tool: espflash@4.6.0
      - name: Install image merge tool
        run: python3 -m pip install esptool==5.5.0
      # The same command and options as the release script (scripts/build-release.sh).
      - name: Release image (real link, product descriptor, flashable image)
        run: scripts/build-image.sh ci-out
      - name: USB debug build and layout
        run: FEATURES=usb-debug scripts/build-image.sh ci-out/usb-debug
      # Same source, instrumentation on: it must keep compiling and linking (bench qualification image).
      - name: Qualification build (instrumentation on)
        run: FEATURES=qual scripts/build-image.sh ci-out/qual
      - uses: actions/upload-artifact@v4
        with:
          name: streambewi-esp32s3-ci
          path: ci-out/
