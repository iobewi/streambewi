name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - name: Radio Browser result filter (JS, no dependencies)
        run: node tools/qual/check-catalog.cjs && node --check app/src/ui.js
      - run: cargo +stable clippy -p streambewi --locked --target x86_64-unknown-linux-gnu --all-targets -- -D warnings
      - run: cargo +stable test -p streambewi --locked --target x86_64-unknown-linux-gnu
      - name: OTA partition layout (table, alignments, slots, EKV pages)
        run: python3 tools/package_image.py --check-layout

  esp32s3:
    runs-on: ubuntu-latest
    steps:
      # The head commit itself (not the synthetic merge commit) with its full history: the image's
      # build date comes from the last commit touching the sources, so the image is the one anyone
      # rebuilds from that commit with scripts/build-image.sh.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Install Rust for Xtensa
        uses: esp-rs/xtensa-toolchain@v1.7.0
        with:
          buildtargets: esp32s3
          version: "1.98.1.0"
          default: false
          override: false
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Compile and link ESP32-S3 release
        shell: bash
        run: |
          set -euo pipefail
          source scripts/build-env.sh
          $BUILD_CMD
      - name: Check product descriptor and ELF layout
        run: python3 tools/inspect_firmware_elf.py target/xtensa-esp32s3-none-elf/release/streambewi-esp32
