[build]
target = "xtensa-esp32s3-none-elf"
rustflags = ["-C", "force-frame-pointers"]

[target.xtensa-esp32s3-none-elf]
runner = "espflash flash --monitor"

[unstable]
build-std = ["core"]

[env]
# Default log level; embassy-usb control tracing only exists with
# `--features usb-debug`.
ESP_LOG = "info,embassy_usb=trace"
