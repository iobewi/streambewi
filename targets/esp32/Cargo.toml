[package]
name = "streambewi-esp32"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
usb-debug = ["streambewi/usb-debug"]
# Debug build: driver traces, stack/heap high-water probe. The operating log (Info/Warn on UART0) is
# always on; this adds the debug detail. Off by default; CI compiles both.
qual = ["usb-debug", "esp-alloc/internal-heap-stats"]

[dependencies]
streambewi = { path = "../../app" }
esp-hal = { version = "~1.2", default-features = false, features = ["esp32s3", "rt", "unstable"] }
esp-rtos = { version = "~0.4", default-features = false, features = ["esp32s3", "embassy", "esp-alloc", "esp-radio"] }
esp-alloc = { version = "~0.11", default-features = false, features = ["esp32s3", "global-allocator", "compat"] }
esp-bootloader-esp-idf = { version = "~0.6", default-features = false, features = ["esp32s3"] }
embassy-executor = { version = "0.10", default-features = false }
embassy-net = { version = "0.9.1", default-features = false, features = ["dhcpv4", "medium-ethernet", "tcp", "dns"] }
embedded-io-async = "0.7"
static_cell = "2.1"
esp-println = { version = "~0.18", default-features = false, features = ["esp32s3", "uart", "log-04"] }
embassy-time = { version = "0.5", default-features = false }
log = "0.4"
iobewi-config-space = { git = "https://github.com/iobewi/rust-mcu-libs", rev = "f85b0b71e93e72585c67ccc3c6f534f32b03cb98" }
iobewi-esp-config-space = { git = "https://github.com/iobewi/rust-mcu-libs", rev = "f85b0b71e93e72585c67ccc3c6f534f32b03cb98", features = ["esp32s3"] }
iobewi-esp-flash = { git = "https://github.com/iobewi/rust-mcu-libs", rev = "f85b0b71e93e72585c67ccc3c6f534f32b03cb98", features = ["esp32s3"] }
iobewi-esp-wifi = { git = "https://github.com/iobewi/rust-mcu-libs", rev = "f85b0b71e93e72585c67ccc3c6f534f32b03cb98", features = ["esp32s3"] }
iobewi-esp-usb = { git = "https://github.com/iobewi/rust-mcu-libs", rev = "f85b0b71e93e72585c67ccc3c6f534f32b03cb98", features = ["esp32s3"] }
iobewi-wifi-manager = { git = "https://github.com/iobewi/rust-mcu-libs", rev = "f85b0b71e93e72585c67ccc3c6f534f32b03cb98" }
iobewi-log = { git = "https://github.com/iobewi/rust-mcu-libs", rev = "f85b0b71e93e72585c67ccc3c6f534f32b03cb98" }
# HTTPS stations: the TLS client, the public trust anchors in flash and the clock the certificate dates need.
iobewi-esp-tls = { git = "https://github.com/iobewi/rust-mcu-libs", rev = "f85b0b71e93e72585c67ccc3c6f534f32b03cb98", default-features = false, features = ["esp32s3", "public-pki"] }
iobewi-tls-service = { git = "https://github.com/iobewi/rust-mcu-libs", rev = "f85b0b71e93e72585c67ccc3c6f534f32b03cb98" }
iobewi-tls-roots = { git = "https://github.com/iobewi/rust-mcu-libs", rev = "f85b0b71e93e72585c67ccc3c6f534f32b03cb98" }
iobewi-ntp = { git = "https://github.com/iobewi/rust-mcu-libs", rev = "f85b0b71e93e72585c67ccc3c6f534f32b03cb98" }
iobewi-time = { git = "https://github.com/iobewi/rust-mcu-libs", rev = "f85b0b71e93e72585c67ccc3c6f534f32b03cb98" }
