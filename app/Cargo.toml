[package]
name = "streambewi"
version = "0.1.0"
edition = "2024"
publish = false
description = "StreamBeWI product logic: provisioning, live stream and USB MSC radio, portable over its platform ports"

[features]
default = []
usb-debug = ["embassy-usb/log", "iobewi-usb-msc/usb-debug"]

[dependencies]
streambewi-core = { path = "../core" }

embassy-futures = "0.1.2"
embassy-net = { version = "0.9.0", features = ["dhcpv4", "medium-ethernet", "tcp", "dns"] }
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
embassy-usb = { version = "0.6.0", default-features = false }
embedded-hal-async = "1.0.0"
embedded-io-async = "0.7.0"
log = "0.4"
reqwless = { version = "0.14.0", default-features = false }
static_cell = "2.1.1"
serde_json = { version = "1", default-features = false, features = ["alloc"] }
picoserve = { version = "0.20.0", default-features = false, features = ["embassy", "alloc"] }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }

improv-serial = { git = "https://github.com/iobewi/rust-mcu-libs", rev = "174079effdb9380c90695be0d86b2b54a8e5fa44" }
iobewi-config-space = { git = "https://github.com/iobewi/rust-mcu-libs", rev = "174079effdb9380c90695be0d86b2b54a8e5fa44" }
iobewi-log = { git = "https://github.com/iobewi/rust-mcu-libs", rev = "174079effdb9380c90695be0d86b2b54a8e5fa44" }
iobewi-fat16 = { git = "https://github.com/iobewi/rust-mcu-libs", rev = "174079effdb9380c90695be0d86b2b54a8e5fa44" }
iobewi-usb-msc = { git = "https://github.com/iobewi/rust-mcu-libs", rev = "174079effdb9380c90695be0d86b2b54a8e5fa44" }
iobewi-wifi-core = { git = "https://github.com/iobewi/rust-mcu-libs", rev = "174079effdb9380c90695be0d86b2b54a8e5fa44" }
iobewi-wifi-manager = { git = "https://github.com/iobewi/rust-mcu-libs", rev = "174079effdb9380c90695be0d86b2b54a8e5fa44" }


[dev-dependencies]
embassy-time = { version = "0.5.1", features = ["std", "generic-queue-8"] }
critical-section = { version = "1.2", features = ["std"] }
