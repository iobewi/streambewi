[package]
name = "streambewi"
version = "0.1.0"
edition = "2024"
publish = false
description = "StreamBeWI product logic: provisioning, live stream and USB MSC radio, portable over its platform ports"

[features]
default = []
usb-debug = ["embassy-usb/log", "iobewi-usb-msc/usb-debug"]
# Bench qualification only: ends the stream connection on a schedule (`QUAL_DROP_LIVES`, build-time
# environment, seconds), alternately closed cleanly and dropped without a close. Not a network outage.
qual = []

[dependencies]
streambewi-core = { path = "../core" }

embassy-futures = "0.1.2"
embassy-net = { version = "0.9.0", features = ["dhcpv4", "medium-ethernet", "tcp", "dns"] }
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
embassy-usb = { version = "0.6.0", default-features = false }
embedded-hal-async = "1.0.0"
embedded-io-async = "0.7.0"
log = "0.4"
edge-http = { version = "0.8", default-features = false, features = ["io"] }
static_cell = "2.1.1"
serde_json = { version = "1", default-features = false, features = ["alloc"] }
heapless = { version = "0.9", default-features = false }
picoserve = { version = "0.20.0", default-features = false, features = ["embassy", "alloc"] }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }

iobewi-state = { git = "https://github.com/iobewi/rust-mcu-libs", rev = "f9a2a9a4099dd43c3e9eb0b1410fc3a523286f53" }
iobewi-indicator = { git = "https://github.com/iobewi/rust-mcu-libs", rev = "f9a2a9a4099dd43c3e9eb0b1410fc3a523286f53" }
improv-serial = { git = "https://github.com/iobewi/rust-mcu-libs", rev = "f9a2a9a4099dd43c3e9eb0b1410fc3a523286f53" }
iobewi-config-space = { git = "https://github.com/iobewi/rust-mcu-libs", rev = "f9a2a9a4099dd43c3e9eb0b1410fc3a523286f53" }
iobewi-log = { git = "https://github.com/iobewi/rust-mcu-libs", rev = "f9a2a9a4099dd43c3e9eb0b1410fc3a523286f53" }
iobewi-log-config = { git = "https://github.com/iobewi/rust-mcu-libs", rev = "f9a2a9a4099dd43c3e9eb0b1410fc3a523286f53" }
iobewi-http-client = { git = "https://github.com/iobewi/rust-mcu-libs", rev = "f9a2a9a4099dd43c3e9eb0b1410fc3a523286f53" }
iobewi-net-io = { git = "https://github.com/iobewi/rust-mcu-libs", rev = "f9a2a9a4099dd43c3e9eb0b1410fc3a523286f53" }
iobewi-fat16 = { git = "https://github.com/iobewi/rust-mcu-libs", rev = "f9a2a9a4099dd43c3e9eb0b1410fc3a523286f53" }
iobewi-usb-msc = { git = "https://github.com/iobewi/rust-mcu-libs", rev = "f9a2a9a4099dd43c3e9eb0b1410fc3a523286f53" }
iobewi-wifi-core = { git = "https://github.com/iobewi/rust-mcu-libs", rev = "f9a2a9a4099dd43c3e9eb0b1410fc3a523286f53" }
iobewi-wifi-manager = { git = "https://github.com/iobewi/rust-mcu-libs", rev = "f9a2a9a4099dd43c3e9eb0b1410fc3a523286f53" }
# The image digest format of the OTA request (`sha256:<hex>`).
iobewi-firmware-image = { git = "https://github.com/iobewi/rust-mcu-libs", rev = "f9a2a9a4099dd43c3e9eb0b1410fc3a523286f53" }


[dev-dependencies]
# Host tests of the server's timeouts run picoserve on a tokio socket (the firmware uses the embassy one).
picoserve = { version = "0.20.0", default-features = false, features = ["embassy", "alloc", "tokio"] }
tokio = { version = "1", features = ["rt", "net", "time", "io-util", "macros"] }
ekv = { version = "=1.0.0", features = ["crc", "max-value-size-8192", "max-chunk-size-256", "std"] }
embassy-time = { version = "0.5.1", features = ["std", "generic-queue-8"] }
critical-section = { version = "1.2", features = ["std"] }
